<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrador - Secundario N°59</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.min.css') }}">

    <!-- Tipografías similares a la imagen -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, rgba(255,255,255,0.7), transparent 35%),
                linear-gradient(135deg, #f7f0df 0%, #f4ead3 50%, #f8f2e5 100%);
            color: #4b2924;
            font-family: 'Cormorant Garamond', Georgia, serif;
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 20px 35px;
        }

        /* Encabezado superior */
        .top-header {
            width: 100%;
            max-width: 1100px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 48px;
        }

        .top-line {
            height: 1px;
            flex: 1;
            max-width: 360px;
            background: #c9a55d;
            opacity: 0.85;
        }

        .top-diamond {
            color: #c99535;
            font-size: 21px;
            line-height: 1;
        }

        .school-name {
            position: absolute;
            top: 36px;
            text-align: center;
            color: #542b26;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        /* Tarjeta */
        .login-card {
            width: 100%;
            max-width: 575px;
            background: rgba(255, 252, 244, 0.88);
            border: 1px solid #d9c7a7;
            border-radius: 22px;
            padding: 28px 48px 38px;
            box-shadow:
                0 12px 35px rgba(92, 62, 31, 0.08),
                0 2px 5px rgba(92, 62, 31, 0.04);
            position: relative;
        }

        /* Icono de usuarios */
        .users-icon {
            width: 64px;
            height: 58px;
            margin: 0 auto 5px;
            position: relative;
            color: #b98938;
        }

        .person {
            position: absolute;
            border: 3px solid currentColor;
            border-radius: 50%;
        }

        .person-main {
            width: 19px;
            height: 19px;
            left: 20px;
            top: 3px;
        }

        .body-main {
            position: absolute;
            width: 35px;
            height: 22px;
            left: 11px;
            top: 29px;
            border: 3px solid currentColor;
            border-radius: 22px 22px 0 0;
            border-bottom: 0;
        }

        .person-small {
            width: 15px;
            height: 15px;
            right: 7px;
            top: 9px;
            color: #633027;
        }

        .body-small {
            position: absolute;
            width: 24px;
            height: 17px;
            right: 0;
            top: 29px;
            border: 3px solid #633027;
            border-radius: 18px 18px 0 0;
            border-bottom: 0;
        }

        .title {
            margin: 0;
            text-align: center;
            color: #542b26;
            font-size: 36px;
            line-height: 1.1;
            font-weight: 700;
        }

        .subtitle {
            margin: 7px 0 16px;
            text-align: center;
            color: #72534c;
            font-size: 17px;
            letter-spacing: 0.3px;
        }

        /* Separador */
        .separator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin: 5px 0 22px;
        }

        .separator-line {
            width: 105px;
            height: 1px;
            background: #d1b47a;
        }

        .separator-diamond {
            color: #b88838;
            font-size: 18px;
        }

        /* Mensajes */
        .flash-message {
            background: #fbf1df;
            border: 1px solid #d8b978;
            border-left: 4px solid #a96b35;
            color: #70412d;
            padding: 11px 14px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
        }

        /* Formulario */
        .form-group {
            margin-bottom: 21px;
        }

        .form-label {
            display: block;
            margin-bottom: 9px;
            color: #4e2b26;
            font-size: 19px;
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #ae8b62;
            width: 20px;
            height: 20px;
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            height: 54px;
            border: 1px solid #d5c5a9;
            border-radius: 13px;
            background: rgba(255, 252, 244, 0.55);
            color: #4b2924;
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 17px;
            padding: 0 17px 0 58px;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-input::placeholder {
            color: #b4a18b;
            opacity: 1;
        }

        .form-input:focus {
            border-color: #b7893d;
            box-shadow: 0 0 0 3px rgba(183, 137, 61, 0.10);
            background: #fffdf8;
        }

        /* Botón */
        .login-button {
            width: 100%;
            height: 64px;
            margin-top: 10px;
            border: 2px solid #d0a54f;
            border-radius: 13px;
            background: linear-gradient(180deg, #713026 0%, #5a211d 100%);
            color: #fff9eb;
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 3px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.12),
                0 3px 8px rgba(74, 35, 25, 0.14);
            transition: all 0.2s ease;
        }

        .login-button:hover {
            background: linear-gradient(180deg, #7c352b 0%, #63231e 100%);
            transform: translateY(-1px);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.12),
                0 5px 12px rgba(74, 35, 25, 0.20);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .key-icon {
            font-size: 23px;
            color: white;
        }

        .arrow {
            font-size: 26px;
            font-family: Arial, sans-serif;
            font-weight: 300;
        }

        /* Parte inferior */
        .bottom-decoration {
            margin-top: 27px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .bottom-line {
            width: 115px;
            height: 1px;
            background: #d6bf91;
        }

        .crown {
            color: #c99a3d;
            font-size: 23px;
            line-height: 1;
        }

        .forgot-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            margin-top: 19px;
            color: #63332c;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .forgot-link:hover {
            color: #a16f2f;
        }

        .lock-small {
            font-size: 16px;
        }

        .home-link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 14px;
    color: #9a8068;
    text-decoration: none;
    font-family: 'Montserrat', sans-serif;
    font-size: 12px;
    font-weight: 500;
    transition: all 0.2s ease;
}

.home-link:hover {
    color: #63332c;
}

.home-icon {
    font-family: Georgia, serif;
    font-size: 18px;
    color: #b7893d;
    line-height: 1;
}

        /* Responsive */
        @media (max-width: 640px) {
            .page {
                padding: 15px;
            }

            .school-name {
                position: static;
                font-size: 10px;
                letter-spacing: 2px;
                margin-bottom: 30px;
                white-space: normal;
            }

            .top-header {
                margin-bottom: 10px;
            }

            .top-line {
                display: none;
            }

            .login-card {
                padding: 25px 24px 32px;
                border-radius: 18px;
            }

            .title {
                font-size: 30px;
            }

            .subtitle {
                font-size: 15px;
            }

            .separator-line {
                width: 75px;
            }

            .form-label {
                font-size: 18px;
            }

            .login-button {
                font-size: 18px;
                letter-spacing: 2px;
            }

            .bottom-line {
                width: 80px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <!-- Encabezado superior -->
    <div class="top-header">
        <div class="top-line"></div>
        <div class="top-diamond">◆</div>
        <div class="top-line"></div>
    </div>

    <div class="school-name">
        Colegio N.º 59 • Olga Márquez de Aredez
    </div>

    <!-- Tarjeta de login -->
    <div class="login-card">

        <!-- Icono usuarios -->
        <div class="users-icon">
            <div class="person person-main"></div>
            <div class="body-main"></div>
            <div class="person person-small"></div>
            <div class="body-small"></div>
        </div>

        <h1 class="title">
            Panel de Administrador
        </h1>

        <p class="subtitle">
            Secundario N°59 “Olga Márquez de Aredez”
        </p>

        <!-- Separador -->
        <div class="separator">
            <div class="separator-line"></div>
            <div class="separator-diamond">◆</div>
            <div class="separator-line"></div>
        </div>

        <!-- Mensajes de Flask -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash-message">
                        ⚠️ {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Formulario -->
        <form action="/admin/login" method="POST">

            <!-- Usuario -->
            <div class="form-group">
                <label class="form-label">
                    Usuario:
                </label>

                <div class="input-wrapper">
                    <svg class="input-icon"
                         viewBox="0 0 24 24"
                         fill="currentColor"
                         aria-hidden="true">
                        <path d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm0 2c-3.33 0-10 1.67-10 5v3h20v-3c0-3.33-6.67-5-10-5z"/>
                    </svg>

                    <input
                        type="text"
                        name="usuario"
                        required
                        autocomplete="username"
                        class="form-input"
                        placeholder="Ingrese su usuario"
                    >
                </div>
            </div>

            <!-- Contraseña -->
            <div class="form-group">
                <label class="form-label">
                    Contraseña:
                </label>

                <div class="input-wrapper">
                    <svg class="input-icon"
                         viewBox="0 0 24 24"
                         fill="currentColor"
                         aria-hidden="true">
                        <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2z"/>
                    </svg>

                    <input
                        type="password"
                        name="password"
                        required
                        autocomplete="current-password"
                        class="form-input"
                        placeholder="Ingrese su contraseña"
                    >
                </div>
            </div>

            <!-- Botón -->
            <button type="submit" class="login-button">
                <span>INICIAR SESIÓN</span>
                <span class="arrow">→</span>
            </button>

        </form>

        <!-- Decoración inferior -->
        <div class="bottom-decoration">
            <div class="bottom-line"></div>
            <div class="crown">♛</div>
            <div class="bottom-line"></div>
        </div>

        <!-- Recuperar contraseña -->
        <a href="#" class="forgot-link">
            <span class="lock-small"></span>
        </a>

    </div>
    <a href="/" class="home-link">
    <span class="home-icon">⌂</span>
    <span>Volver al inicio</span>
</a>

</div>

</body>
</html>
